services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steam-wishlist
    restart: unless-stopped
    ports:
      - "4001:4000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=file:/app/data/steam.db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
